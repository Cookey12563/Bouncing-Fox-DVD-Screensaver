<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bouncing Fox</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-width: 320px;
      min-height: 240px;
      margin: 0;
      overflow: hidden;
      cursor: none;
      background: #000;
    }
    body { font-family: system-ui, sans-serif; }
    #stage {
      position: fixed;
      inset: 0;
      min-width: 320px;
      min-height: 240px;
      overflow: hidden;
      cursor: none;
      background: #000;
    }
    #fox {
      position: absolute;
      left: 0;
      top: 0;
      width: clamp(57px, 12.1vmin, 123px);
      height: clamp(57px, 12.1vmin, 123px);
      display: grid;
      place-items: center;
      font-size: clamp(48px, 9.9vmin, 103px);
      line-height: 1;
      user-select: none;
      pointer-events: none;
      will-change: transform;
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="A fox emoji bouncing around the screen">
    <div id="fox" role="img" aria-label="fox">🦊</div>
  </main>
  <script>
    (() => {
      const stage = document.getElementById('stage');
      const fox = document.getElementById('fox');
      const speed = 230;
      let x = 24, y = 24;
      let vx = speed, vy = speed * 0.72;
      let last = performance.now();
      function bounds() {
        return { width: stage.clientWidth, height: stage.clientHeight, foxWidth: fox.offsetWidth, foxHeight: fox.offsetHeight };
      }
      function keepInBounds() {
        const b = bounds();
        x = Math.min(Math.max(x, 0), Math.max(0, b.width - b.foxWidth));
        y = Math.min(Math.max(y, 0), Math.max(0, b.height - b.foxHeight));
      }
      function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        const b = bounds();
        const maxX = Math.max(0, b.width - b.foxWidth);
        const maxY = Math.max(0, b.height - b.foxHeight);
        x += vx * dt;
        y += vy * dt;
        while (x < 0 || x > maxX) {
          x = x < 0 ? -x : 2 * maxX - x;
          vx = -vx;
        }
        while (y < 0 || y > maxY) {
          y = y < 0 ? -y : 2 * maxY - y;
          vy = -vy;
        }
        fox.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        requestAnimationFrame(frame);
      }
      addEventListener('resize', keepInBounds);
      new ResizeObserver(keepInBounds).observe(stage);
      keepInBounds();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
